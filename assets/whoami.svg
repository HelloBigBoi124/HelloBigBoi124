<text class="ttl" x="450" y="24" text-anchor="middle">~/heitor/whoami.c</text>
<text x="28" y="82" class="x" opacity="0" xml:space="preserve"><tspan class="k">#include </tspan><tspan class="s">&lt;career.h&gt;</tspan><animate attributeName="opacity" from="0" to="1" dur="0.01s" begin="0.00s" fill="freeze"/></text>
