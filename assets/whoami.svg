<text x="28" y="174" class="x" opacity="0" xml:space="preserve"><tspan class="p">  .role   = </tspan><tspan class="s">"Front-End &amp; Full-Stack Developer"</tspan><tspan class="p">,</tspan><animate attributeName="opacity" from="0" to="1" dur="0.01s" begin="1.35s" fill="freeze"/></text>
<text x="28" y="200" class="x" opacity="0" xml:space="preserve"><tspan class="p">  .school = </tspan><tspan class="s">"Ciência da Computação @ UNIP (6º período)"</tspan><tspan class="p">,</tspan><animate attributeName="opacity" from="0" to="1" dur="0.01s" begin="1.80s" fill="freeze"/></text>
<text x="28" y="226" class="x" opacity="0" xml:space="preserve"><tspan class="p">  .base   = </tspan><tspan class="s">"Goiânia, GO — Brasil"</tspan><tspan class="p">,</tspan><animate attributeName="opacity" from="0" to="1" dur="0.01s" begin="2.25s" fill="freeze"/></text>
<text x="28" y="252" class="x" opacity="0" xml:space="preserve"><tspan class="p">  .stack  = </tspan><tspan class="s">{"React", "JavaScript", "Tailwind", "Java", "Python", "SQL"}</tspan><tspan class="p">,</tspan><animate attributeName="opacity" from="0" to="1" dur="0.01s" begin="2.70s" fill="freeze"/></text>
<text x="28" y="278" class="x" opacity="0" xml:space="preserve"><tspan class="p">  .status = </tspan><tspan class="t">OPEN_TO_WORK</tspan><tspan class="p">,  </tspan><tspan class="m">// vagas júnior · remoto, híbrido ou Goiânia</tspan><animate attributeName="opacity" from="0" to="1" dur="0.01s" begin="3.15s" fill="freeze"/></text>
<text x="28" y="304" class="x" opacity="0" xml:space="preserve"><tspan class="p">};</tspan><animate attributeName="opacity" from="0" to="1" dur="0.01s" begin="3.60s" fill="freeze"/></text>
<text x="28" y="338" class="x" opacity="0" xml:space="preserve"><tspan class="k">$ </tspan><tspan class="p">./contratar_heitor</tspan><animate attributeName="opacity" from="0" to="1" dur="0.01s" begin="4.05s" fill="freeze"/></text>
